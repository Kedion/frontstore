<svg xmlns="http://www.w3.org/2000/svg"
    width="800"
    height="800"
    viewBox="0 0 800 800">

  <!-- Background -->
  <rect width="800" height="800" fill="#f3f4f6"/>

  <!-- Product package -->
  <rect
    x="175"
    y="55"
    width="450"
    height="690"
    rx="30"
    fill="#ffffff"
    stroke="#d1d5db"
    stroke-width="4"/>

  <!-- Brand header -->
  <path
    d="M205 55 H595 Q625 55 625 85 V190 H175 V85 Q175 55 205 55Z"
    fill="#1e3a8a"/>

  <text
    x="400"
    y="125"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="48"
    font-weight="700"
    fill="#ffffff">
    FRONTSTORE
  </text>

  <text
    x="400"
    y="165"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
    font-weight="600"
    letter-spacing="3"
    fill="#d1d5db">
    DEVELOPMENT SAMPLE
  </text>

  <!-- Product category -->
  <text
    x="400"
    y="265"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="46"
    font-weight="700"
    fill="#111827">
    SOFT DRINK
  </text>

  <text
    x="400"
    y="315"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="25"
    font-weight="600"
