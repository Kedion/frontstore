    CARBONATED BEVERAGE
  </text>

  <!-- Simple product illustration -->
  <circle
    cx="400"
    cy="455"
    r="105"
    fill="#eff6ff"
    stroke="#1e3a8a"
    stroke-width="4"/>

  <circle
    cx="400"
    cy="455"
    r="68"
    fill="#ffffff"
    stroke="#d1d5db"
    stroke-width="3"/>

  <text
    x="400"
    y="447"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    font-weight="700"
    fill="#1e3a8a">
    BEVERAGES
  </text>

  <text
    x="400"
    y="478"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
